# .github/workflows/build.yml
#
# Единый workflow для OWRT Console:
#   - lint:   gofmt + go vet для host и client
#   - host:   linux/amd64  (x86_64 VPS)
#   - client: linux/arm64  (aarch64, OpenWRT)
#   - release: при теге v* прикладывает артефакты к GitHub Release
#
# CGO выключен — бинарники статические.
# Триггеры: push в main/master, тег v*, ручной запуск.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"

jobs:
  # ==================================================================
  # LINT — gofmt + vet для обоих модулей
  # ==================================================================
  lint:
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          cd host
          test -z "$(gofmt -l .)" || (echo "host: gofmt нашёл проблемы:"; gofmt -d .; exit 1)
          cd ../client
          test -z "$(gofmt -l .)" || (echo "client: gofmt нашёл проблемы:"; gofmt -d .; exit 1)

      - name: host vet
        working-directory: host
        run: |
          go mod tidy
          go vet ./...

      - name: client vet
        working-directory: client
        run: |
          go mod tidy
          go vet ./...

  # ==================================================================
  # HOST — linux/amd64
  # ==================================================================
  build-host:
    name: build host (linux/amd64)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: host/go.sum

      - name: go mod tidy
        working-directory: host
        run: go mod tidy

      - name: build
        working-directory: host
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o ../dist/owrt-host-linux-amd64 .

      - name: package (binary + web assets + README)
        run: |
          cd dist
          mkdir -p owrt-host-linux-amd64
          mv owrt-host-linux-amd64 owrt-host-linux-amd64/owrt-host
          cp -r ../host/web owrt-host-linux-amd64/web
          cp ../README.md owrt-host-linux-amd64/ 2>/dev/null || true
          tar czf owrt-host-linux-amd64.tar.gz owrt-host-linux-amd64
          sha256sum owrt-host-linux-amd64.tar.gz > owrt-host-linux-amd64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-host-linux-amd64
          path: |
            dist/owrt-host-linux-amd64.tar.gz
            dist/owrt-host-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  # ==================================================================
  # CLIENT — linux/arm64 (aarch64, OpenWRT)
  # ==================================================================
  build-client:
    name: build client (linux/arm64 / aarch64)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      - name: go mod tidy
        working-directory: client
        run: go mod tidy

      - name: build
        working-directory: client
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o ../dist/owrt-client-linux-arm64 .

      - name: package
        run: |
          cd dist
          mkdir -p owrt-client-linux-arm64
          mv owrt-client-linux-arm64 owrt-client-linux-arm64/owrt-client
          cp ../README.md owrt-client-linux-arm64/ 2>/dev/null || true
          tar czf owrt-client-linux-arm64.tar.gz owrt-client-linux-arm64
          sha256sum owrt-client-linux-arm64.tar.gz > owrt-client-linux-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-client-linux-arm64
          path: |
            dist/owrt-client-linux-arm64.tar.gz
            dist/owrt-client-linux-arm64.tar.gz.sha256
          if-no-files-found: error

  # ==================================================================
  # RELEASE — только на тег v*
  # ==================================================================
  release:
    name: release
    needs: [build-host, build-client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: list artifacts
        run: find artifacts -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/owrt-host-linux-amd64/*.tar.gz
            artifacts/owrt-host-linux-amd64/*.sha256
            artifacts/owrt-client-linux-arm64/*.tar.gz
            artifacts/owrt-client-linux-arm64/*.sha256
          generate_release_notes: true
